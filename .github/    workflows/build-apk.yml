
name: Build Rushd APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Rushd_Android_Connected.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract project ZIP
        run: |
          unzip -o Rushd_Android_Connected.zip -d .

      - name: Prepare Android project
        working-directory: android
        run: |
          flutter create --platforms=android .
          flutter pub get

      - name: Build APK
        working-directory: android
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rushd-Android-APK
          path: android/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
